name: Matching M07 completion

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
      - "matching-*"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Parse every frozen JSON resource
        shell: bash
        run: |
          mapfile -t resources < <(find schemas matching-testkit/src/test/resources -type f -name '*.json' -print | sort)
          test "${#resources[@]}" -gt 0
          jq empty "${resources[@]}"

      - name: Execute completed M07 boundary
        id: boundary
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M07
          test "$(sed -n 's/^planVersion=//p' course.properties)" = 0.9
          test "$(sed -n 's/^lifecycle=//p' course.properties)" = COMPLETE
          test "$(sed -n 's/^designDepth=//p' course.properties)" = IMPLEMENTED
          test "$(sed -n 's/^m07Check.expectedStatus=//p' course.properties)" = PASS
          test -z "$(git tag --points-at HEAD --list 'matching-*')"
          test "$(git cat-file -t course/m07-complete)" = tag
          complete_commit="$(git rev-parse 'course/m07-complete^{}')"
          git merge-base --is-ancestor "$complete_commit" HEAD
          ./gradlew clean build --no-daemon
          ./gradlew m07Check --no-daemon
          jq -e '
            .schemaVersion == "matching.m07.check.v2" and
            .unit == "M07" and
            .status == "PASS" and
            .contractPlanVersion == "0.9" and
            .inheritedM06.status == "PASS" and
            .inheritedM06.fixedScenarios == 15 and
            .inheritedM06.fixedCommands == 64 and
            .inheritedM06.generatedCommands == 10240 and
            .inheritedM06.coverageObligations == 26 and
            .inheritedM06.mutantsKilled == 10 and
            .legacyEntrypoints == {
              "executed": 3,
              "place": true,
              "placeRequest": true,
              "placeGoverned": true,
              "semanticResultsIdentical": true,
              "participantGroupId": 0,
              "stpPolicy": "NONE"
            } and
            .fixedCorpus.scenarios == 16 and
            .fixedCorpus.commands == 72 and
            .fixedCorpus.commandCounts == {
              "PLACE": 61,
              "CANCEL": 8,
              "PREPARE_RULE_SET": 1,
              "ACTIVATE_RULE_SET": 1,
              "CHANGE_MARKET_MODE": 1
            } and
            .fixedCorpus.canonicalFormat == "M07F1" and
            .fixedCorpus.canonicalDigest == "sha256:4c0675ee77458fb10b28e3c13d48767a653a41e922f42264f8d0f76aa5644176" and
            .fixedCorpus.canonicalBytes == 10128 and
            .fixedCorpus.canonicalLines == 73 and
            .fixedCorpus.differentialComparisons == 72 and
            .fixedCorpus.eventLedgerChecks == 72 and
            .generator.algorithm == "splitmix64-v1" and
            .generator.baseSeed == "5707" and
            .generator.histories == 160 and
            .generator.commandsPerHistory == 64 and
            .generator.commands == 10240 and
            .generator.lanes == 5 and
            .generator.historiesPerLane == 32 and
            .generator.canonicalFormat == "M07H1" and
            .generator.canonicalDigest == "sha256:c2576f10a77c320ec4a9ad75e3dc3c03494f636feabdcc7157ee10e74812718f" and
            .generator.canonicalBytes == 1709692 and
            .generator.canonicalLines == 10241 and
            .generator.freshGenerations == 2 and
            .properties.differentialComparisons == 10240 and
            .properties.eventLedgerChecks == 10240 and
            .properties.referenceLedgerChecks == 10240 and
            .coverage.requiredObligations == 24 and
            .coverage.satisfiedObligations == 24 and
            .counterexamples.required == 8 and
            .counterexamples.found == 8 and
            .counterexamples.replayed == 8 and
            .counterexamples.oneMinimal == 8 and
            .counterexamples.totalCommands == 18 and
            .counterexamples.canonicalFormat == "M07X1" and
            .counterexamples.canonicalDigest == "sha256:97504762c7f6349ac6bb02c26457d608dae6e0ad0231a19b10cf5c998a9c69ee" and
            .counterexamples.canonicalBytes == 2778 and
            .counterexamples.canonicalLines == 19 and
            .mutants.required == 8 and
            .mutants.killed == 8 and
            .mutants.classification == "STUDENT_FAILURE" and
            .mutants.systemErrorControl == "SYSTEM_ERROR" and
            .mutants.systemErrorCountsAsKill == false and
            .architecture.passed == true and
            .architecture.coreSources == 54 and
            .architecture.referenceSources == 29 and
            .architecture.forbiddenFindings == 0 and
            .evidenceScope == {
              "finiteCorpus": true,
              "formalProof": false,
              "productionReadinessClaim": false,
              "replicationOrFailoverCovered": false
            } and
            (.tutorialPermalinks | length) == 5 and
            .releaseTarget.productRelease == null
          ' build/reports/m07/check.json
          evidence_generated=false
          if test "$complete_commit" = "$(git rev-parse HEAD)"; then
            ./gradlew m07Evidence -Pm07.unitTag=course/m07-complete --no-daemon
            jq -e '
              .schemaVersion == "cex.lab-evidence.v1" and
              .case == "high-availability-cex" and
              .project == "matching" and
              .unit == "M07" and
              .unitTag == "course/m07-complete" and
              .productRelease == null and
              .planVersion == "0.9" and
              .source.commit == env.GITHUB_SHA and
              .source.dirty == false
            ' build/lab-evidence/M07/manifest.json
            evidence_generated=true
          else
            echo "M07 evidence remains frozen at $complete_commit; validating descendant maintenance commit only."
          fi
          echo "evidence_generated=$evidence_generated" >> "$GITHUB_OUTPUT"

      - name: Upload M07 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m07-reports
          path: build/reports/m07/
          if-no-files-found: error

      - name: Upload M07 clean-tree evidence
        if: steps.boundary.outputs.evidence_generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: matching-m07-evidence
          path: build/lab-evidence/M07/
          if-no-files-found: error
