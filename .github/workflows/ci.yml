name: Matching M10 contract

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
      - "matching-*"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Parse every frozen JSON resource
        shell: bash
        run: |
          mapfile -t resources < <(find schemas matching-testkit/src/test/resources -type f -name '*.json' -print | sort)
          test "${#resources[@]}" -gt 0
          jq empty "${resources[@]}"

      - name: Verify M09 inherited GREEN and M10 structured RED
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M10
          test "$(sed -n 's/^planVersion=//p' course.properties)" = 0.12
          test "$(sed -n 's/^lifecycle=//p' course.properties)" = READY
          test "$(sed -n 's/^designDepth=//p' course.properties)" = CONTRACT
          test "$(sed -n 's/^m10Check.expectedStatus=//p' course.properties)" = GOAL_NOT_IMPLEMENTED
          test "$(sed -n 's/^startRef=//p' course.properties)" = course/m10-start
          test "$(sed -n 's/^completeRef=//p' course.properties)" = course/m10-complete

          test "$(git cat-file -t course/m09-complete)" = tag
          git merge-base --is-ancestor "$(git rev-parse 'course/m09-complete^{}')" HEAD

          if test "${GITHUB_REF}" = refs/tags/course/m10-start; then
            test "$(git cat-file -t course/m10-start)" = tag
            test "$(git rev-parse 'course/m10-start^{}')" = "$(git rev-parse HEAD)"
          elif git rev-parse --verify --quiet 'refs/tags/course/m10-start^{commit}' >/dev/null; then
            test "$(git cat-file -t course/m10-start)" = tag
            git merge-base --is-ancestor "$(git rev-parse 'course/m10-start^{}')" HEAD
          fi

          ./gradlew clean build --no-daemon --max-workers=1
          jq -e '
            .schemaVersion == "matching.m09.check.v2" and
            .unit == "M09" and
            .status == "PASS" and
            .contractPlanVersion == "0.11" and
            .coverage == {"required": 32, "observed": 32} and
            .mutants.required == 12 and
            .mutants.killedAsStudentFailure == 12 and
            .mutants.systemErrorCountedAsKill == false and
            .releaseTarget.productRelease == null
          ' build/reports/m09/check.json

          m10_log="${RUNNER_TEMP:-/tmp}/m10-gradle-output.log"
          set +e
          set -o pipefail
          ./gradlew m10Check --no-daemon --max-workers=1 2>&1 | tee "$m10_log"
          exit_code="${PIPESTATUS[0]}"
          set +o pipefail
          set -e
          test "$exit_code" -ne 0
          grep -Fq "M10 check status: GOAL_NOT_IMPLEMENTED" "$m10_log"
          jq -e '
            .schemaVersion == "matching.m10.check.v1" and
            .unit == "M10" and
            .status == "GOAL_NOT_IMPLEMENTED" and
            .contractPlanVersion == "0.12" and
            .inheritedBaseline == {
              "unit": "M09",
              "completeRef": "course/m09-complete",
              "expectedStatus": "PASS"
            } and
            .workloadProfile == {
              "sha256": "992882b78caef35c35680d0073921ae8bb0df71d59c21c4236ebfc056f7f8ace",
              "seed": "6010",
              "fixedScenarios": 20,
              "generatedHistories": 64,
              "actionsPerHistory": 256,
              "generatedActions": 16384,
              "lanes": 4,
              "queueCapacity": 64,
              "coverageObligations": 28,
              "requiredMutants": 12,
              "schemaProbes": 8
            } and
            .admissionContract.submission == "TRY_SUBMIT_NON_BLOCKING" and
            .admissionContract.fullResult == "OVERLOADED_BEFORE_WAL" and
            .admissionContract.acceptedCompletion == "EXACTLY_ONE_SUBMISSION_RESULT_OR_EXPLICIT_FAILURE" and
            .measurementContract.microbenchmark == {
              "harness": "JMH",
              "mode": "SampleTime",
              "benchmarks": [
                "io.github.lchareln.cex.matching.benchmark.CoreMatchingBenchmark.restingMakerThenMatchingTaker",
                "io.github.lchareln.cex.matching.benchmark.CoreMatchingBenchmark.canonicalEnvelopeDecode"
              ],
              "resultScope": "DIAGNOSTIC_ONLY",
              "releaseGate": false
            } and
            .measurementContract.qualificationRuntime.policyId == "M10Q1" and
            .measurementContract.qualificationRuntime.scope == "M10_DEDICATED_NOT_M09_DEFAULT" and
            .measurementContract.qualificationRuntime.m09Default == {"maxSuffixRecords": 64, "maxSuffixBytes": 1048576} and
            .measurementContract.qualificationRuntime.finiteRecoveryBudget == {"maxSuffixRecords": 1000000, "maxSuffixBytes": 1073741824} and
            .measurementContract.qualificationRuntime.proactiveCheckpointOffsetNanos == 100000000 and
            .measurementContract.qualificationRuntime.plannedRecordCeilingBytes == 1024 and
            .measurementContract.qualificationRuntime.phaseBudgetPreflight.validatePrefixAndSuffixSeparately == true and
            .measurementContract.qualificationRuntime.scheduler.allInitialOffersBeforeScheduledWindowEnd == true and
            .measurementContract.qualificationRuntime.observationCut == "SCHEDULED_WINDOW_END_BEFORE_TERMINAL_DRAIN" and
            .measurementContract.qualificationRuntime.terminalDrain == "ZERO_PENDING_BEFORE_RECOVERY" and
            .measurementContract.releaseOpenLoop.calibrationSeconds == 20 and
            .measurementContract.releaseOpenLoop.sweeps == 3 and
            .measurementContract.releaseOpenLoop.warmupSecondsPerRate == 10 and
            .measurementContract.releaseOpenLoop.measurementSecondsPerRate == 30 and
            .measurementContract.releaseOpenLoop.rateLadderPermille == [250, 500, 700, 850, 1000, 1150, 1350, 1600] and
            .measurementContract.releaseOpenLoop.percentiles == [0.5, 0.95, 0.99, 0.999] and
            .measurementContract.releaseOpenLoop.latencyOrigin == "SCHEDULED_ARRIVAL" and
            .measurementContract.ciSmoke == {
              "profileId": "CI_SMOKE",
              "resultScope": "METHOD_SMOKE_ONLY",
              "eligibleForReleaseEvidence": false,
              "methodIsomorphic": true
            } and
            .measurementContract.saturation.perSweepKnee == "FIRST_OF_TWO_CONSECUTIVE_SATURATED_RATES" and
            .measurementContract.saturation.publishedKnee == "MIN_OF_THREE_SWEEP_KNEES" and
            .measurementContract.saturation.qualifiedOperatingPoint == "FLOOR_70_PERCENT_OF_PUBLISHED_KNEE" and
            .measurementContract.releaseSoak.durationSeconds == 1800 and
            (.coverageObligations | length) == 28 and
            (.requiredMutants | length) == 12 and
            (.tutorialPermalinks | length) == 5 and
            (has("fixedResults") | not) and
            (has("benchmarkResults") | not) and
            (has("mutants") | not) and
            .releaseTarget == {
              "unitTag": "course/m10-complete",
              "productRelease": "matching-0.5.0",
              "verification": "FULL_RELEASE_PROFILE_AND_CLEAN_TREE_EVIDENCE"
            }
          ' build/reports/m10/check.json
          test ! -e build/lab-evidence/M10

      - name: Upload M09 inherited reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m09-inherited-reports
          path: build/reports/m09/
          if-no-files-found: error

      - name: Upload M10 RED report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m10-reports
          path: build/reports/m10/
          if-no-files-found: error
