name: Matching M11/M12 Aeron correctness

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
      - "matching-*"
  pull_request:

permissions:
  contents: read

jobs:
  structured-red:
    if: github.ref == 'refs/tags/course/m11-start'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate M11 declaration and frozen bytes
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M11
          test "$(sed -n 's/^planVersion=//p' course.properties)" = 0.14
          test "$(sed -n 's/^lifecycle=//p' course.properties)" = READY
          test "$(sed -n 's/^designDepth=//p' course.properties)" = CONTRACT
          test "$(sed -n 's/^m11Check.expectedStatus=//p' course.properties)" = GOAL_NOT_IMPLEMENTED
          test "$(sed -n 's/^startRef=//p' course.properties)" = course/m11-start
          test "$(sed -n 's/^completeRef=//p' course.properties)" = course/m11-complete

          test "$(git cat-file -t course/m10-complete)" = tag
          test "$(git cat-file -t matching-0.5.0)" = tag
          git merge-base --is-ancestor "$(git rev-parse 'course/m10-complete^{}')" HEAD
          git merge-base --is-ancestor "$(git rev-parse 'matching-0.5.0^{}')" HEAD
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            test "${GITHUB_REF_NAME}" = course/m11-start
            test "$(git rev-parse 'course/m11-start^{}')" = "$(git rev-parse HEAD)"
          fi

          test "$(sha256sum matching-testkit/src/test/resources/m11/workload-v1.json | cut -d ' ' -f 1)" = f856c8dcf2e902add248a59cdb97525083bae469745682eed0ea7ae9169033b6
          mapfile -t resources < <(find schemas matching-testkit/src/test/resources -type f -name '*.json' -print | sort)
          jq empty "${resources[@]}"
          test "$(jq '.goldenFixtures | length' matching-testkit/src/test/resources/m11/workload-v1.json)" = 6
          while IFS=$'\t' read -r path expected_bytes expected_sha; do
            test "$(wc -c < "${path}" | tr -d ' ')" = "${expected_bytes}"
            test "$(sha256sum "${path}" | cut -d ' ' -f 1)" = "${expected_sha}"
          done < <(jq -r '.goldenFixtures[] | [.path, (.bytes | tostring), .sha256] | @tsv' matching-testkit/src/test/resources/m11/workload-v1.json)

      - name: Run inherited M10 green build
        shell: bash
        run: |
          ./gradlew clean build \
            -Pm10.cpuModel="GitHub-hosted-${RUNNER_ARCH}" \
            -Pm10.storageDevice="GitHub-hosted-ephemeral" \
            -Pm10.filesystem="runner-temp" \
            -Pm10.powerPolicy="GITHUB_HOSTED_RUNNER_DEFAULT" \
            -Pm10.runId="m11-start-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --no-daemon --max-workers=1

      - name: Run and verify intentional M11 structured RED
        shell: bash
        run: |
          set +e
          ./gradlew m11Check --no-daemon --max-workers=1
          check_exit=$?
          set -e
          test "${check_exit}" = 1
          jq -e '
            .schemaVersion == "matching.m11.check.v1" and
            .unit == "M11" and
            .status == "GOAL_NOT_IMPLEMENTED" and
            .contractPlanVersion == "0.14" and
            .workloadProfile.sha256 == "f856c8dcf2e902add248a59cdb97525083bae469745682eed0ea7ae9169033b6" and
            .workloadProfile.segmentOrder == "FIXED_DECLARED_32_SEGMENT_SCHEDULE" and
            (.workloadProfile.segmentSchedule | length) == 32 and
            .workloadProfile.generatedActions == 4096 and
            .workloadProfile.composition == "ONE_CONTINUOUS_CORPUS_OF_32_ORDERED_SEGMENTS" and
            .workloadProfile.stateResetBetweenSegments == false and
            .clusterContract.memberCount == 1 and
            .clusterContract.totalActualClusterIngress == 8192 and
            .clusterContract.snapshotPrefixNewApplied == 1536 and
            .clusterContract.snapshotPrefixDuplicateReplayed == 512 and
            .clusterContract.snapshotNextApplicationSequence == 1537 and
            .clusterContract.firstPostRestartLane == "PREVIOUS_NEW" and
            .clusterContract.firstPostRestartExpectedStatus == "NEW_APPLIED" and
            .clusterContract.postRestartCrossSnapshotDuplicates == 512 and
            .clusterContract.adminSnapshotAcceptance == "OK_REQUIRED_NOT_COMPLETION" and
            (.clusterContract.snapshotCompletionWitnesses | length) == 5 and
            .protocolContract.requestV1ResponseVersion == 1 and
            .protocolContract.requestV2AllowedResponseVersions == [1, 2] and
            .protocolContract.goldenSnapshotBindings == 2 and
            .clusterContract.highAvailabilityClaim == false and
            .protocolContract.nMinusOneRestore == "NO_IDEMPOTENCY_OR_ORIGINAL_RESULT_LOSS" and
            .executionContract.structuredRedExitCode == 1 and
            (.goldenFixtures | length) == 6
          ' build/reports/m11/check.json
          exit 1

      - name: Upload M11 structured RED report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m11-start-structured-red
          path: build/reports/m11/
          if-no-files-found: error

  m12-structured-red:
    if: github.ref == 'refs/tags/course/m12-start'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate M12 declaration and frozen workload
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M12
          test "$(sed -n 's/^planVersion=//p' course.properties)" = 0.15
          test "$(sed -n 's/^lifecycle=//p' course.properties)" = READY
          test "$(sed -n 's/^designDepth=//p' course.properties)" = CONTRACT
          test "$(sed -n 's/^m12Check.expectedStatus=//p' course.properties)" = GOAL_NOT_IMPLEMENTED
          test "$(sed -n 's/^startRef=//p' course.properties)" = course/m12-start
          test "$(sed -n 's/^completeRef=//p' course.properties)" = course/m12-complete
          test "$(sed -n 's/^productRelease=//p' course.properties)" = matching-0.8.0

          test "$(git cat-file -t course/m11-complete)" = tag
          test "$(git rev-parse 'course/m11-complete^{}')" = 6997e05cea81cb93b883e882c8d75887d0622a22
          git merge-base --is-ancestor "$(git rev-parse 'course/m11-complete^{}')" HEAD
          test "$(git rev-parse 'course/m11-complete:matching-core')" = "$(git rev-parse 'HEAD:matching-core')"
          test "$(git rev-parse 'course/m11-complete:matching-cluster-runtime')" = "$(git rev-parse 'HEAD:matching-cluster-runtime')"
          test "$(git rev-parse 'course/m11-complete:matching-testkit/src/test/resources/m11/goldens')" = "$(git rev-parse 'HEAD:matching-testkit/src/test/resources/m11/goldens')"
          test "${GITHUB_REF_NAME}" = course/m12-start
          test "$(git rev-parse 'course/m12-start^{}')" = "$(git rev-parse HEAD)"

          test "$(sha256sum matching-testkit/src/test/resources/m12/workload-v1.json | cut -d ' ' -f 1)" = 20ed1e75cd3cd86dc15a7f1f64465524a5638757abe676eb51f20bc5423b89a1
          mapfile -t resources < <(find schemas matching-testkit/src/test/resources -type f -name '*.json' -print | sort)
          jq empty "${resources[@]}"
          test "$(jq '.fixedScenarios | length' matching-testkit/src/test/resources/m12/workload-v1.json)" = 14
          test "$(jq '.coverageRequirements | length' matching-testkit/src/test/resources/m12/workload-v1.json)" = 25
          test "$(jq '.faultSchedule.phaseOrder | length' matching-testkit/src/test/resources/m12/workload-v1.json)" = 14

      - name: Run inherited M00-M11 green build
        shell: bash
        run: |
          ./gradlew clean build \
            -Pm10.cpuModel="GitHub-hosted-${RUNNER_ARCH}" \
            -Pm10.storageDevice="GitHub-hosted-ephemeral" \
            -Pm10.filesystem="runner-temp" \
            -Pm10.powerPolicy="GITHUB_HOSTED_RUNNER_DEFAULT" \
            -Pm10.runId="m12-start-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --no-daemon --max-workers=1

      - name: Run and verify intentional M12 structured RED
        shell: bash
        run: |
          set +e
          ./gradlew m12Check --no-daemon --max-workers=1
          check_exit=$?
          set -e
          test "${check_exit}" = 1
          jq -e '
            .schemaVersion == "matching.m12.check.v1" and
            .unit == "M12" and
            .status == "GOAL_NOT_IMPLEMENTED" and
            .contractPlanVersion == "0.15" and
            .inheritedBaseline.commit == "6997e05cea81cb93b883e882c8d75887d0622a22" and
            .inheritedBaseline.matchingCoreTreeUnchanged == true and
            .inheritedBaseline.m11ClusterRuntimeTreeUnchanged == true and
            .inheritedBaseline.m11ApplicationGoldensUnchanged == true and
            .workloadProfile.sha256 == "20ed1e75cd3cd86dc15a7f1f64465524a5638757abe676eb51f20bc5423b89a1" and
            .workloadProfile.fixedScenarios == 14 and
            .workloadProfile.coverageObligations == 25 and
            (.workloadProfile.phaseOrder | length) == 14 and
            .clusterContract.memberCount == 3 and
            .clusterContract.memberIds == [0, 1, 2] and
            .clusterContract.quorumSize == 2 and
            .clusterContract.processIsolationClaim == true and
            .clusterContract.twoMemberFailureAck == false and
            .clusterContract.matchingCoreChanges == 0 and
            .clusterContract.m11WireVersionChanges == 0 and
            .clientOutcomeContract.afterAcceptanceWithoutResponse == "UNKNOWN" and
            .clientOutcomeContract.unknownRetry == "SAME_DURABLE_COMMAND_IDENTITY_FRESH_CORRELATION" and
            .clientOutcomeContract.timeoutIsBusinessRejection == false and
            .releaseTarget.productRelease == "matching-0.8.0" and
            .executionContract.structuredRedExitCode == 1
          ' build/reports/m12/check.json
          exit 1

      - name: Upload M12 structured RED report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m12-start-structured-red
          path: build/reports/m12/
          if-no-files-found: error

  completion-green:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/unit/') || github.ref == 'refs/tags/course/m11-complete'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate M11 completion declaration and frozen inputs
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M11
          test "$(sed -n 's/^planVersion=//p' course.properties)" = 0.14
          test "$(sed -n 's/^lifecycle=//p' course.properties)" = COMPLETE
          test "$(sed -n 's/^designDepth=//p' course.properties)" = IMPLEMENTED
          test "$(sed -n 's/^m11Check.expectedStatus=//p' course.properties)" = PASS
          test "$(sed -n 's/^startRef=//p' course.properties)" = course/m11-start
          test "$(sed -n 's/^completeRef=//p' course.properties)" = course/m11-complete

          test "$(git cat-file -t course/m11-start)" = tag
          test "$(git cat-file -t course/m10-complete)" = tag
          test "$(git cat-file -t matching-0.5.0)" = tag
          test "$(git rev-parse 'course/m10-complete^{}')" = "$(git rev-parse 'matching-0.5.0^{}')"
          git merge-base --is-ancestor "$(git rev-parse 'course/m10-complete^{}')" "$(git rev-parse 'course/m11-start^{}')"
          git merge-base --is-ancestor "$(git rev-parse 'course/m11-start^{}')" HEAD
          git merge-base --is-ancestor "$(git rev-parse 'course/m10-complete^{}')" HEAD
          git merge-base --is-ancestor "$(git rev-parse 'matching-0.5.0^{}')" HEAD
          test -z "$(git tag --points-at HEAD --list 'matching-*')"
          if [[ "${GITHUB_EVENT_NAME}" != pull_request ]]; then
            test "$(git cat-file -t course/m11-complete)" = tag
            test "$(git rev-parse 'course/m11-complete^{}')" = "$(git rev-parse HEAD)"
            if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
              test "${GITHUB_REF_NAME}" = course/m11-complete
            fi
          fi

          test "$(sha256sum matching-testkit/src/test/resources/m11/workload-v1.json | cut -d ' ' -f 1)" = f856c8dcf2e902add248a59cdb97525083bae469745682eed0ea7ae9169033b6
          mapfile -t resources < <(find schemas matching-testkit/src/test/resources -type f -name '*.json' -print | sort)
          jq empty "${resources[@]}"
          test "$(jq '.goldenFixtures | length' matching-testkit/src/test/resources/m11/workload-v1.json)" = 6
          while IFS=$'\t' read -r path expected_bytes expected_sha; do
            test "$(wc -c < "${path}" | tr -d ' ')" = "${expected_bytes}"
            test "$(sha256sum "${path}" | cut -d ' ' -f 1)" = "${expected_sha}"
          done < <(jq -r '.goldenFixtures[] | [.path, (.bytes | tostring), .sha256] | @tsv' matching-testkit/src/test/resources/m11/workload-v1.json)

      - name: Run inherited and M11 green build
        shell: bash
        run: |
          ./gradlew clean build \
            -Pm10.cpuModel="GitHub-hosted-${RUNNER_ARCH}" \
            -Pm10.storageDevice="GitHub-hosted-ephemeral" \
            -Pm10.filesystem="runner-temp" \
            -Pm10.powerPolicy="GITHUB_HOSTED_RUNNER_DEFAULT" \
            -Pm10.runId="m11-complete-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --no-daemon --max-workers=1

      - name: Run and verify M11 strict PASS
        shell: bash
        run: |
          ./gradlew m11Check --no-daemon --max-workers=1
          jq -e --arg commit "$(git rev-parse HEAD)" '
            .schemaVersion == "matching.m11.check.v2" and
            .unit == "M11" and
            .status == "PASS" and
            .source.commit == $commit and
            .source.dirty == false and
            .workloadProfile.sha256 == "f856c8dcf2e902add248a59cdb97525083bae469745682eed0ea7ae9169033b6" and
            .generator.actionsPerPath == 4096 and
            .generator.continuousCorpus == true and
            .generator.clusterRuns == 2 and
            .generator.totalActualClusterIngress == 8192 and
            .generator.newOrdinalsContinuous == true and
            .generator.duplicateStateInvariantChecks == 1024 and
            .generator.conflictStateInvariantChecks == 1024 and
            .generator.segmentSchedule == ["CURRENT_NEW[0]", "CURRENT_NEW[1]", "CURRENT_NEW[2]", "CURRENT_NEW[3]", "CURRENT_NEW[4]", "CURRENT_NEW[5]", "CURRENT_NEW[6]", "CURRENT_NEW[7]", "DUPLICATE_REPLAY[0]", "DUPLICATE_REPLAY[1]", "DUPLICATE_REPLAY[2]", "DUPLICATE_REPLAY[3]", "PREVIOUS_NEW[0]", "PREVIOUS_NEW[1]", "PREVIOUS_NEW[2]", "PREVIOUS_NEW[3]", "PREVIOUS_NEW[4]", "PREVIOUS_NEW[5]", "PREVIOUS_NEW[6]", "PREVIOUS_NEW[7]", "DUPLICATE_REPLAY[4]", "DUPLICATE_REPLAY[5]", "DUPLICATE_REPLAY[6]", "DUPLICATE_REPLAY[7]", "IDENTITY_CONFLICT[0]", "IDENTITY_CONFLICT[1]", "IDENTITY_CONFLICT[2]", "IDENTITY_CONFLICT[3]", "IDENTITY_CONFLICT[4]", "IDENTITY_CONFLICT[5]", "IDENTITY_CONFLICT[6]", "IDENTITY_CONFLICT[7]"] and
            .clusterRuntime.implementation == "REAL_AERON_CLUSTER" and
            .clusterRuntime.acceptedIngressOffers == 8192 and
            .clusterRuntime.correlatedResponses == 8192 and
            .clusterRuntime.serviceRole == "LEADER" and
            .clusterRuntime.aeronConfiguredVersion == "1.52.2" and
            .clusterRuntime.agronaConfiguredVersion == "2.5.0" and
            .clusterRuntime.aeronRuntimeVersion == "1.52.2" and
            .clusterRuntime.agronaRuntimeVersion == "2.5.0" and
            .clusterRuntime.componentErrorsSampledAfterTeardown == true and
            .clusterRuntime.teardownsCompleted == 2 and
            .clusterRuntime.portBlocksDisjoint == true and
            .clusterRuntime.ownedRootsDisjoint == true and
            (.clusterRuntime.portBlocks | map(.run)) == ["UNINTERRUPTED", "SNAPSHOT_RESTART"] and
            (.clusterRuntime.runtimeWitnesses | map(.phase)) == ["UNINTERRUPTED", "SNAPSHOT_RESTART_BEFORE", "SNAPSHOT_RESTART_AFTER"] and
            (.clusterRuntime.runtimeWitnesses | all(.memberCount == 1 and .memberId == 0 and .appointedLeaderId == 0 and .serviceRole == "LEADER")) and
            .snapshotRestart.adminRequestAccepted == true and
            .snapshotRestart.acceptanceDistinctFromCompletion == true and
            .snapshotRestart.controlToggleResetToNeutral == true and
            .snapshotRestart.recordingIdsChanged == true and
            .snapshotRestart.sameTermAndLogPosition == true and
            .snapshotRestart.loadedSnapshot == true and
            .protocol.responseV1OutcomesCovered == 4 and
            .protocol.payloadHashOuterInvariant == true and
            .protocol.payloadHashOuterFieldProbes == 8 and
            .protocol.payloadHashPayloadMutationProbes == 10 and
            .protocol.payloadHashPayloadSensitive == true and
            .protocol.forgedPayloadHashPreApplyRejected == true and
            .protocol.forgedPayloadHashStateMutations == 0 and
            .fixed.scenarios == 22 and
            .fixed.passed == 22 and
            .coverage.observed == 28 and
            .mutants.killed == 10 and
            .mutants.productionControlsPassed == 10 and
            .mutants.serializedFreshReplays == 10 and
            .mutants.serializedReplayFingerprintsExact == true and
            .mutants.oneMinimalCounterexamples == 10 and
            .mutants.systemErrorsObserved == 3 and
            .mutants.systemErrorCountedAsKill == false and
            .replay.replayed == 10 and
            .replay.persistedBytesParsed == true and
            .replay.fingerprintsExact == true and
            .replay.oneDeleteAudits == 10 and
            .architecture.callbackReachableStandaloneWalReferences == 0 and
            .architecture.callbackReachableExternalIoReferences == 0 and
            .architecture.standaloneWalWritesEvidenceMode == "CALLBACK_REACHABLE_SOURCE_REFERENCE_COUNT_COMPATIBILITY" and
            .architecture.abstractProductionCallbacks == .architecture.implementedProductionCallbacks and
            .architecture.logCallbackBusinessApplyCalls == 1 and
            .architecture.nonLogCallbackBusinessApplyCalls == 0 and
            .architecture.versionConfigurationExact == true and
            .architecture.runtimeMetadataDigestStable == true and
            (.artifactBindings | length) == 12 and
            .clusterRuntime.highAvailabilityClaim == false and
            .clusterRuntime.performanceClaim == false and
            .clusterRuntime.externalServices == false and
            .releaseTarget.productRelease == null
          ' build/reports/m11/check.json

      - name: Publish complete-tag evidence
        if: github.ref == 'refs/tags/course/m11-complete'
        shell: bash
        run: ./gradlew m11Evidence --no-daemon --max-workers=1

      - name: Upload M11 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m11-completion-reports
          path: |
            build/reports/m11/
            build/lab-evidence/M11/
          if-no-files-found: error
