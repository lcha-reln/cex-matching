name: Matching M08 contract

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
      - "matching-*"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Parse every frozen JSON resource
        shell: bash
        run: |
          mapfile -t resources < <(find schemas matching-testkit/src/test/resources -type f -name '*.json' -print | sort)
          test "${#resources[@]}" -gt 0
          jq empty "${resources[@]}"

      - name: Execute declared M08 boundary
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M08
          test "$(sed -n 's/^planVersion=//p' course.properties)" = 0.10
          test "$(sed -n 's/^lifecycle=//p' course.properties)" = READY
          test "$(sed -n 's/^designDepth=//p' course.properties)" = CONTRACT
          test "$(sed -n 's/^m08Check.expectedStatus=//p' course.properties)" = GOAL_NOT_IMPLEMENTED
          ./gradlew clean build --no-daemon
          m08_log="${RUNNER_TEMP:-/tmp}/m08-gradle-output.log"
          set +e
          set -o pipefail
          ./gradlew m08Check --no-daemon 2>&1 | tee "$m08_log"
          exit_code="${PIPESTATUS[0]}"
          set +o pipefail
          set -e
          test "$exit_code" -ne 0
          grep -Fq "M08 check status: GOAL_NOT_IMPLEMENTED" "$m08_log"
          jq -e '
            .schemaVersion == "matching.m08.check.v1" and
            .unit == "M08" and
            .status == "GOAL_NOT_IMPLEMENTED" and
            .contractPlanVersion == "0.10" and
            .fixedCorpus.sha256 == "5160121600c151c91db5431a4e1a8ef8fcd4a73ba67683d96a09daba389100a3" and
            .fixedCorpus.primaryCount == 20 and
            .fixedCorpus.operations == 73 and
            .fixedCorpus.schemaProbes == 4 and
            .generator.sha256 == "477a2b16be5d2d6f6f378b203660bf1106db89409ad06e77bdb7837edbfc74ea" and
            .generator.baseSeed == "5808" and
            .generator.primaryCount == 96 and
            .generator.operations == 4608 and
            .generator.generatedOperations == 4608 and
            .generator.lanes == 4 and
            .generator.historiesPerLane == 24 and
            .generator.coverageObligations == 24 and
            (.requiredMutants | length) == 10 and
            (.tutorialPermalinks | length) == 5 and
            (.fixedCorpus | has("resultDigest") | not) and
            (.generator | has("resultDigest") | not) and
            (has("mutants") | not) and
            .releaseTarget.productRelease == null
          ' build/reports/m08/check.json

      - name: Upload M08 RED report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m08-reports
          path: build/reports/m08/
          if-no-files-found: error
