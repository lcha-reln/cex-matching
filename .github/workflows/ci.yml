name: Matching M07 contract

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
      - "matching-*"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Parse every frozen JSON resource
        shell: bash
        run: |
          mapfile -t resources < <(find schemas matching-testkit/src/test/resources -type f -name '*.json' -print | sort)
          test "${#resources[@]}" -gt 0
          jq empty "${resources[@]}"

      - name: Execute declared M07 boundary
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M07
          test "$(sed -n 's/^planVersion=//p' course.properties)" = 0.9
          test "$(sed -n 's/^lifecycle=//p' course.properties)" = READY
          test "$(sed -n 's/^designDepth=//p' course.properties)" = CONTRACT
          test "$(sed -n 's/^m07Check.expectedStatus=//p' course.properties)" = GOAL_NOT_IMPLEMENTED
          ./gradlew clean m06Check --no-daemon
          m07_log="${RUNNER_TEMP:-/tmp}/m07-gradle-output.log"
          set +e
          set -o pipefail
          ./gradlew m07Check --no-daemon 2>&1 | tee "$m07_log"
          exit_code="${PIPESTATUS[0]}"
          set +o pipefail
          set -e
          test "$exit_code" -ne 0
          grep -Fq "M07 check status: GOAL_NOT_IMPLEMENTED" "$m07_log"
          jq -e '
            .schemaVersion == "matching.m07.check.v1" and
            .unit == "M07" and
            .status == "GOAL_NOT_IMPLEMENTED" and
            .contractPlanVersion == "0.9" and
            .fixedCorpus.scenarios == 16 and
            .fixedCorpus.commands == 72 and
            .generator.baseSeed == "5707" and
            .generator.totalCommands == 10240 and
            .generator.coverageObligations == 24 and
            (.tutorialPermalinks | length) == 5 and
            (.requiredMutants | length) == 8 and
            (.fixedCorpus | has("canonicalDigest") | not) and
            (.generator | has("canonicalDigest") | not) and
            (has("mutants") | not) and
            .releaseTarget.productRelease == null
          ' build/reports/m07/check.json

      - name: Upload M07 RED report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m07-reports
          path: build/reports/m07/
          if-no-files-found: error
