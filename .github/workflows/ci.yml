name: Matching M08 contract

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
      - "matching-*"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Parse every frozen JSON resource
        shell: bash
        run: |
          mapfile -t resources < <(find schemas matching-testkit/src/test/resources -type f -name '*.json' -print | sort)
          test "${#resources[@]}" -gt 0
          jq empty "${resources[@]}"

      - name: Execute declared M08 boundary
        id: boundary
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M08
          test "$(sed -n 's/^planVersion=//p' course.properties)" = 0.10
          test "$(sed -n 's/^lifecycle=//p' course.properties)" = COMPLETE
          test "$(sed -n 's/^designDepth=//p' course.properties)" = IMPLEMENTED
          test "$(sed -n 's/^m08Check.expectedStatus=//p' course.properties)" = PASS
          test -z "$(git tag --points-at HEAD --list 'matching-*')"
          test "$(git cat-file -t course/m08-complete)" = tag
          complete_commit="$(git rev-parse 'course/m08-complete^{}')"
          git merge-base --is-ancestor "$complete_commit" HEAD
          ./gradlew clean build --no-daemon --max-workers=1
          ./gradlew m08Check --no-daemon --max-workers=1
          jq -e '
            .schemaVersion == "matching.m08.check.v2" and
            .unit == "M08" and
            .status == "PASS" and
            .contractPlanVersion == "0.10" and
            .inheritedM07 == {
              "unit": "M07",
              "status": "PASS",
              "fixedScenarios": 16,
              "fixedCommands": 72,
              "generatedHistories": 160,
              "generatedCommands": 10240,
              "coverageObligations": 24,
              "mutantsKilled": 8
            } and
            .inputs.fixedSha256 == "5160121600c151c91db5431a4e1a8ef8fcd4a73ba67683d96a09daba389100a3" and
            .inputs.generatorSha256 == "477a2b16be5d2d6f6f378b203660bf1106db89409ad06e77bdb7837edbfc74ea" and
            .fixed.scenarios == 20 and
            .fixed.digest == "444e999094bc58aabed7869df60a07a019de9969f8bd39318edc3c0590527472" and
            .fixed.injectedFaults == 7 and
            .generator.baseSeed == "5808" and
            .generator.histories == 96 and
            .generator.operationsPerHistory == 48 and
            .generator.operations == 4608 and
            .generator.profileDrivenOperations == 1152 and
            .generator.invalidEnvelopes == 192 and
            .generator.businessRejections == 576 and
            .generator.selectedOperations == {
              "FAULT": 56,
              "DUPLICATE": 111,
              "RESTART": 92,
              "SUBMIT": 732,
              "ROLLOVER": 57,
              "CONFLICT": 104
            } and
            .generator.digest == "56a2d7f63df96737c286bab5c96a16aa50e0dd33df58f9cefc9d7abee5aaff41" and
            .durability.envelope == "M08C1" and
            .durability.wal == "M08W1" and
            .durability.preprovisionedRealNonSymlinkWalDirectory == true and
            .durability.ancestorDirectoryDurabilityExternal == true and
            .durability.runtimeCreatesWalDirectory == false and
            .coverage == {"required": 24, "observed": 24} and
            .mutants.required == 10 and
            .mutants.killed == 10 and
            .mutants.throwingControl == "SYSTEM_ERROR" and
            .mutants.systemErrorCountedAsKill == false and
            .mutants.candidateDriver == "EXECUTABLE_MUTATED_RUNTIME" and
            .mutants.actualMutationActions == 13 and
            .mutants.fullRestartGrammar == true and
            .architecture.coreSources == 54 and
            .architecture.localRuntimeSources == 28 and
            .architecture.violations == 0 and
            .faultEvidence.childProcessCrashSmokes == 3 and
            .faultEvidence.beforeOperationFailures == 7 and
            .faultEvidence.actualFilesystemForTypedInjections == false and
            .faultEvidence.realPowerLoss == false and
            .faultEvidence.realDiskFull == false and
            .faultEvidence.physicalMediaDurability == false and
            .staleClassification.directWitness == false and
            .releaseTarget.productRelease == null
          ' build/reports/m08/check.json
          evidence_generated=false
          if test "$complete_commit" = "$(git rev-parse HEAD)"; then
            ./gradlew m08Evidence -Pm08.unitTag=course/m08-complete --no-daemon --max-workers=1
            jq -e '
              .schemaVersion == "cex.lab-evidence.v1" and
              .case == "high-availability-cex" and
              .project == "matching" and
              .unit == "M08" and
              .unitTag == "course/m08-complete" and
              .productRelease == null and
              .planVersion == "0.10" and
              .source.commit == env.GITHUB_SHA and
              .source.dirty == false and
              (.claims | length) == 6 and
              (.limitations | length) == 11
            ' build/lab-evidence/M08/manifest.json
            evidence_generated=true
          else
            echo "M08 evidence remains frozen at $complete_commit; validating descendant maintenance commit only."
          fi
          echo "evidence_generated=$evidence_generated" >> "$GITHUB_OUTPUT"

      - name: Upload M08 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m08-reports
          path: build/reports/m08/
          if-no-files-found: error

      - name: Upload M08 clean-tree evidence
        if: steps.boundary.outputs.evidence_generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: matching-m08-evidence
          path: build/lab-evidence/M08/
          if-no-files-found: error
