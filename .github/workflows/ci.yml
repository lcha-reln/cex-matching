name: Matching M06 contract

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
      - "matching-*"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Parse every frozen JSON resource
        shell: bash
        run: |
          mapfile -t resources < <(find schemas matching-testkit/src/test/resources -type f -name '*.json' -print | sort)
          test "${#resources[@]}" -gt 0
          jq empty "${resources[@]}"

      - name: Execute declared M06 boundary
        id: boundary
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M06
          test "$(sed -n 's/^planVersion=//p' course.properties)" = 0.8
          expected_status="$(sed -n 's/^m06Check.expectedStatus=//p' course.properties)"
          evidence_generated=false
          case "$expected_status" in
            GOAL_NOT_IMPLEMENTED)
              test "$(sed -n 's/^lifecycle=//p' course.properties)" = READY
              test "$(sed -n 's/^designDepth=//p' course.properties)" = CONTRACT
              ./gradlew clean m05Check --no-daemon
              m06_log="${RUNNER_TEMP:-/tmp}/m06-gradle-output.log"
              set +e
              set -o pipefail
              ./gradlew m06Check --no-daemon 2>&1 | tee "$m06_log"
              exit_code="${PIPESTATUS[0]}"
              set +o pipefail
              set -e
              test "$exit_code" -ne 0
              grep -Fq "M06 check status: GOAL_NOT_IMPLEMENTED" "$m06_log"
              jq -e '
                .schemaVersion == "matching.m06.check.v1" and
                .unit == "M06" and
                .status == "GOAL_NOT_IMPLEMENTED" and
                .fixedCorpus.scenarios == 15 and
                .fixedCorpus.commands == 64 and
                .generator.baseSeed == "6606" and
                .generator.totalCommands == 10240 and
                .generator.coverageObligations == 26 and
                (.tutorialPermalinks | length) == 5 and
                (.requiredMutants | length) == 10 and
                (.fixedCorpus | has("canonicalDigest") | not) and
                (.generator | has("canonicalDigest") | not) and
                (has("mutants") | not) and
                .releaseTarget.productRelease == null
              ' build/reports/m06/check.json
              ;;
            PASS)
              test "$(sed -n 's/^lifecycle=//p' course.properties)" = COMPLETE
              test "$(sed -n 's/^designDepth=//p' course.properties)" = IMPLEMENTED
              test -z "$(git tag --points-at HEAD --list 'matching-*')"
              test "$(git cat-file -t course/m06-complete)" = tag
              complete_commit="$(git rev-parse 'course/m06-complete^{}')"
              git merge-base --is-ancestor "$complete_commit" HEAD
              ./gradlew clean build --no-daemon
              ./gradlew m06Check --no-daemon
              jq -e '
                .schemaVersion == "matching.m06.check.v2" and
                .unit == "M06" and
                .status == "PASS" and
                .contractPlanVersion == "0.8" and
                .inheritedM05.status == "PASS" and
                .inheritedM05.fixedScenarios == 12 and
                .inheritedM05.fixedCommands == 54 and
                .inheritedM05.generatedCommands == 10240 and
                .inheritedM05.coverageObligations == 20 and
                .inheritedM05.mutantsKilled == 8 and
                .fixedCorpus.scenarios == 15 and
                .fixedCorpus.commands == 64 and
                .fixedCorpus.commandCounts == {
                  "PLACE": 21,
                  "CANCEL": 6,
                  "PREPARE_RULE_SET": 2,
                  "ACTIVATE_RULE_SET": 2,
                  "CHANGE_MARKET_MODE": 24,
                  "MASS_CANCEL": 9
                } and
                .fixedCorpus.canonicalFormat == "M06F1" and
                .fixedCorpus.canonicalDigest == "sha256:2f9126e7100581020d2a56dd7da4736ab026a7f9533b051bde4490cda210855b" and
                .fixedCorpus.canonicalBytes == 8113 and
                .fixedCorpus.canonicalLines == 65 and
                .fixedCorpus.differentialComparisons == 64 and
                .fixedCorpus.eventLedgerChecks == 64 and
                .generator.algorithm == "splitmix64-v1" and
                .generator.baseSeed == "6606" and
                .generator.histories == 160 and
                .generator.commandsPerHistory == 64 and
                .generator.commands == 10240 and
                .generator.lanes == 5 and
                .generator.historiesPerLane == 32 and
                .generator.canonicalFormat == "M06H1" and
                .generator.canonicalDigest == "sha256:b74dd3a6bad6048dcaaceaaeb8fe0c81d1e8d2272d352fe15ea921738f73e6c4" and
                .generator.canonicalBytes == 1670049 and
                .generator.canonicalLines == 10241 and
                .properties.differentialComparisons == 10240 and
                .properties.eventLedgerChecks == 10240 and
                .properties.referenceLedgerChecks == 10240 and
                .coverage.requiredObligations == 26 and
                .coverage.satisfiedObligations == 26 and
                .counterexamples.required == 10 and
                .counterexamples.found == 10 and
                .counterexamples.replayed == 10 and
                .counterexamples.oneMinimal == 10 and
                .counterexamples.totalCommands == 22 and
                .counterexamples.canonicalFormat == "M06X1" and
                .counterexamples.canonicalDigest == "sha256:f55d1d7feabe527706a9974dbaf1a894c1420ea6b09bc9e1f7b9563032fca93b" and
                .counterexamples.canonicalBytes == 3210 and
                .counterexamples.canonicalLines == 23 and
                .mutants.required == 10 and
                .mutants.killed == 10 and
                .mutants.classification == "STUDENT_FAILURE" and
                .mutants.systemErrorControl == "SYSTEM_ERROR" and
                .mutants.systemErrorCountsAsKill == false and
                .architecture.passed == true and
                .architecture.forbiddenFindings == 0 and
                .evidenceScope == {
                  "finiteCorpus": true,
                  "formalProof": false,
                  "productionReadinessClaim": false,
                  "replicationOrFailoverCovered": false
                } and
                (.tutorialPermalinks | length) == 5 and
                .releaseTarget.productRelease == null
              ' build/reports/m06/check.json
              if test "$complete_commit" = "$(git rev-parse HEAD)"; then
                ./gradlew m06Evidence -Pm06.unitTag=course/m06-complete --no-daemon
                jq -e '
                  .schemaVersion == "cex.lab-evidence.v1" and
                  .case == "high-availability-cex" and
                  .project == "matching" and
                  .unit == "M06" and
                  .unitTag == "course/m06-complete" and
                  .productRelease == null and
                  .planVersion == "0.8" and
                  .source.commit == env.GITHUB_SHA and
                  .source.dirty == false
                ' build/lab-evidence/M06/manifest.json
                evidence_generated=true
              else
                echo "M06 evidence remains frozen at $complete_commit; validating descendant maintenance commit only."
              fi
              ;;
            *)
              echo "unsupported M06 expected status: $expected_status" >&2
              exit 1
              ;;
          esac
          echo "status=$expected_status" >> "$GITHUB_OUTPUT"
          echo "evidence_generated=$evidence_generated" >> "$GITHUB_OUTPUT"

      - name: Upload M06 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m06-reports
          path: build/reports/m06/
          if-no-files-found: error

      - name: Upload M06 clean-tree evidence
        if: steps.boundary.outputs.evidence_generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: matching-m06-evidence
          path: build/lab-evidence/M06/
          if-no-files-found: error
