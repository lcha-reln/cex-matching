name: Matching M04 contract

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
      - "matching-*"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Parse all frozen JSON resources
        shell: bash
        run: |
          resources=(
            schemas/cex.lab-evidence.v1.schema.json
            schemas/matching.m00.fixture.v1.schema.json
            schemas/matching.m00.check.v2.schema.json
            matching-testkit/src/test/resources/m00/fixtures/history-v1.json
            schemas/matching.m01.scenario.v1.schema.json
            schemas/matching.m01.check.v1.schema.json
            schemas/matching.m01.check.v2.schema.json
            matching-testkit/src/test/resources/m01/fixtures/price-time-v1.json
            schemas/matching.m02.scenario.v1.schema.json
            schemas/matching.m02.check.v1.schema.json
            schemas/matching.m02.check.v2.schema.json
            matching-testkit/src/test/resources/m02/fixtures/order-lifecycle-v1.json
            schemas/matching.m03.generator.v1.schema.json
            schemas/matching.m03.check.v1.schema.json
            schemas/matching.m03.check.v2.schema.json
            schemas/matching.m03.counterexamples.v1.schema.json
            matching-testkit/src/test/resources/m03/fixtures/property-suite-v1.json
            schemas/matching.m04.scenario.v1.schema.json
            schemas/matching.m04.generator.v1.schema.json
            schemas/matching.m04.check.v1.schema.json
            matching-testkit/src/test/resources/m04/fixtures/execution-policy-v1.json
            matching-testkit/src/test/resources/m04/fixtures/property-suite-v1.json
          )
          if [[ -f schemas/matching.m04.check.v2.schema.json ]]; then
            resources+=(schemas/matching.m04.check.v2.schema.json)
          fi
          if [[ -f schemas/matching.m04.counterexamples.v1.schema.json ]]; then
            resources+=(schemas/matching.m04.counterexamples.v1.schema.json)
          fi
          jq empty "${resources[@]}"

      - name: Execute the inherited M03 regression and declared M04 boundary
        id: boundary
        shell: bash
        run: |
          unit="$(sed -n 's/^unit=//p' course.properties)"
          test "$unit" = M04
          expected_status="$(sed -n 's/^m04Check.expectedStatus=//p' course.properties)"
          evidence_generated=false
          case "$expected_status" in
            GOAL_NOT_IMPLEMENTED)
              ./gradlew clean build --no-daemon
              jq -e '
                .schemaVersion == "matching.m03.check.v2" and
                .unit == "M03" and
                .status == "PASS" and
                .properties.histories == 256 and
                .properties.commands == 16384 and
                .determinism.commandDigest == "sha256:1920d6b8a480998825c72636d446854d9e795e91b0ab29520f203b12186979ce" and
                .counterexamples.required == 6 and
                .counterexamples.replayed == 6 and
                .mutants.required == 6 and
                .mutants.killed == 6 and
                .releaseTarget.productRelease == "matching-0.1.0"
              ' build/reports/m03/check.json

              mkdir -p build/reports/m04
              m04_log=build/reports/m04/gradle-output.log
              set +e
              set -o pipefail
              ./gradlew m04Check --no-daemon 2>&1 | tee "$m04_log"
              exit_code="${PIPESTATUS[0]}"
              set +o pipefail
              set -e
              test "$exit_code" -ne 0
              grep -Fq "M04 check status: GOAL_NOT_IMPLEMENTED" "$m04_log"
              jq -e '
                .schemaVersion == "matching.m04.check.v1" and
                .unit == "M04" and
                .status == "GOAL_NOT_IMPLEMENTED" and
                .contractPlanVersion == "0.6" and
                .inheritedM03 == {
                  "status": "PASS",
                  "checkSchemaVersion": "matching.m03.check.v2",
                  "histories": 256,
                  "commands": 16384,
                  "commandDigest": "sha256:1920d6b8a480998825c72636d446854d9e795e91b0ab29520f203b12186979ce",
                  "counterexamples": 6,
                  "mutantsKilled": 6,
                  "productRelease": "matching-0.1.0"
                } and
                .fixedCorpus.scenarios == 14 and
                .fixedCorpus.commands == 48 and
                .fixedCorpus.placeCommands == 44 and
                .fixedCorpus.cancelCommands == 4 and
                .fixedCorpus.policyCounts == {
                  "GTC": 25,
                  "IOC": 5,
                  "FOK": 6,
                  "POST_ONLY": 6,
                  "UNKNOWN": 2
                } and
                .fixedCorpus.schemaProbes == 6 and
                .generator.histories == 192 and
                .generator.commandsPerHistory == 64 and
                .generator.totalCommands == 12288 and
                .generator.lanes == 6 and
                .generator.historiesPerLane == 32 and
                .generator.schemaProbes == 6 and
                .executionContract.requestType == "PlaceLimitOrderRequest" and
                .executionContract.policyType == "ExecutionPolicy" and
                .executionContract.legacyMethod == "place(PlaceLimitOrderInput)" and
                .executionContract.requestMethod == "placeRequest(PlaceLimitOrderRequest)" and
                .executionContract.requestComponents == [
                  "orderInput:PlaceLimitOrderInput", "executionPolicy:String"
                ] and
                .executionContract.legacyPolicy == "GTC" and
                .executionContract.policies == ["GTC", "IOC", "FOK", "POST_ONLY"] and
                .executionContract.legacyInputFields == [
                  "instrumentId", "orderId", "side", "priceTicks", "quantityLots"
                ] and
                .executionContract.precedence == [
                  "M00_FIELD_VALIDATION",
                  "EXECUTION_POLICY_VALIDATION",
                  "DUPLICATE_ORDER_ID",
                  "POLICY_STATE_PRECHECK",
                  "ACCEPTANCE_SEQUENCE_CAPACITY",
                  "ACCEPT_AND_EXECUTE"
                ] and
                .executionContract.unknownPolicyEvent == "Rejected" and
                .executionContract.unknownPolicyCode == "INVALID_EXECUTION_POLICY" and
                .executionContract.unknownPolicyField == "executionPolicy" and
                .executionContract.placeRejectionEvent == "PlaceRejected" and
                .executionContract.placeRejectionCodes == [
                  "DUPLICATE_ORDER_ID", "FOK_NOT_FILLABLE", "POST_ONLY_WOULD_TAKE"
                ] and
                .executionContract.acceptedPolicyField == "executionPolicy:ExecutionPolicy" and
                .executionContract.remainderEvent == "RemainderCanceled" and
                .executionContract.remainderReason == "IOC_REMAINDER" and
                .executionContract.protectedLimitField == "priceTicks" and
                .executionContract.fokAtomic == true and
                .executionContract.postOnlyRejectsTouch == true and
                .executionContract.policyRejectionsReserveIdentity == false and
                .executionContract.policyRejectionsConsumeSequence == false and
                .requiredMutants == [
                  "M04-IOC-REMAINDER-RESTS",
                  "M04-IOC-BEHAVES-LIKE-FOK",
                  "M04-FOK-PARTIAL-STATE-LEAK",
                  "M04-FOK-BEST-LEVEL-ONLY",
                  "M04-FOK-IGNORES-LIMIT-PRICE",
                  "M04-POST-ONLY-TOUCH-ACCEPTED",
                  "M04-POLICY-REJECT-CONSUMES-IDENTITY",
                  "M04-UNKNOWN-POLICY-DEFAULTS-GTC"
                ] and
                .releaseTarget == {
                  "unitTag": "course/m04-complete",
                  "productRelease": null,
                  "verification": "M04_EVIDENCE_ONLY"
                }
              ' build/reports/m04/check.json
              ;;
            PASS)
              ./gradlew clean build --no-daemon
              jq -e '
                .schemaVersion == "matching.m04.check.v2" and
                .unit == "M04" and
                .status == "PASS" and
                .contractPlanVersion == "0.6" and
                .fixedCorpus.scenarios == 14 and
                .fixedCorpus.commands == 48 and
                .generator.histories == 192 and
                .generator.commandsPerHistory == 64 and
                .properties.commands == 12288 and
                .counterexamples.required == 8 and
                .counterexamples.replayed == 8 and
                .counterexamples.oneMinimal == 8 and
                .mutants.required == 8 and
                .mutants.killed == 8 and
                .mutants.systemErrorControl == "SYSTEM_ERROR" and
                .releaseTarget.productRelease == null
              ' build/reports/m04/check.json
              if [[ "$GITHUB_REF" == "refs/heads/main" ||
                    "$GITHUB_REF" == "refs/tags/course/m04-complete" ]]; then
                test "$(git cat-file -t course/m04-complete)" = tag
                test "$(git rev-list -n 1 course/m04-complete)" = "$(git rev-parse HEAD)"
                ./gradlew m04Evidence --no-daemon
                jq -e '
                  .schemaVersion == "cex.lab-evidence.v1" and
                  .case == "high-availability-cex" and
                  .project == "matching" and
                  .unit == "M04" and
                  .unitTag == "course/m04-complete" and
                  .productRelease == null and
                  .planVersion == "0.6" and
                  .source.commit == env.GITHUB_SHA and
                  .source.dirty == false
                ' build/lab-evidence/M04/manifest.json
                evidence_generated=true
              fi
              ;;
            *)
              echo "Unknown m04Check.expectedStatus: $expected_status"
              exit 1
              ;;
          esac
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "expected_status=$expected_status" >> "$GITHUB_OUTPUT"
          echo "evidence_generated=$evidence_generated" >> "$GITHUB_OUTPUT"

      - name: Independently verify M04 evidence hashes
        if: ${{ steps.boundary.outputs.evidence_generated == 'true' }}
        shell: bash
        run: |
          evidence=build/lab-evidence/M04
          manifest="$evidence/manifest.json"
          while IFS=$'\t' read -r path expected; do
            case "$path" in
              ""|/*|../*|*/../*|*/..|*\\*) exit 1 ;;
            esac
            test -f "$evidence/$path"
            actual="$(shasum -a 256 "$evidence/$path" | cut -d' ' -f1)"
            test "$actual" = "$expected"
          done < <(jq -r '.claims[].artifacts[] | [.path, .sha256] | @tsv' "$manifest")
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Verify annotated M04 start tag identity
        if: ${{ github.ref == 'refs/tags/course/m04-start' }}
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$GITHUB_REF_NAME" = "$(sed -n 's/^startRef=//p' course.properties)"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"

      - name: Verify annotated M04 completion identity
        if: ${{ github.ref == 'refs/tags/course/m04-complete' }}
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$GITHUB_REF_NAME" = "$(sed -n 's/^completeRef=//p' course.properties)"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"

      - name: Upload M04 evidence
        if: ${{ steps.boundary.outputs.evidence_generated == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: matching-m04-evidence-${{ github.sha }}
          path: build/lab-evidence/M04
          if-no-files-found: error
