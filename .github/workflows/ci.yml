name: Matching M09 contract

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
      - "matching-*"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Parse every frozen JSON resource
        shell: bash
        run: |
          mapfile -t resources < <(find schemas matching-testkit/src/test/resources -type f -name '*.json' -print | sort)
          test "${#resources[@]}" -gt 0
          jq empty "${resources[@]}"

      - name: Verify M08 inherited GREEN and M09 structured RED
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M09
          test "$(sed -n 's/^planVersion=//p' course.properties)" = 0.11
          test "$(sed -n 's/^lifecycle=//p' course.properties)" = READY
          test "$(sed -n 's/^designDepth=//p' course.properties)" = CONTRACT
          test "$(sed -n 's/^m09Check.expectedStatus=//p' course.properties)" = GOAL_NOT_IMPLEMENTED
          test "$(sed -n 's/^startRef=//p' course.properties)" = course/m09-start
          test "$(sed -n 's/^completeRef=//p' course.properties)" = course/m09-complete
          test "$(git cat-file -t course/m08-complete)" = tag
          git merge-base --is-ancestor "$(git rev-parse 'course/m08-complete^{}')" HEAD
          test "$(git cat-file -t course/m09-start)" = tag
          test "$(git rev-parse 'course/m09-start^{}')" = "$(git rev-parse HEAD)"
          test -z "$(git tag --list 'course/m09-complete')"
          test -z "$(git tag --points-at HEAD --list 'matching-*')"

          ./gradlew clean build --no-daemon --max-workers=1
          jq -e '
            .schemaVersion == "matching.m08.check.v2" and
            .unit == "M08" and
            .status == "PASS" and
            .contractPlanVersion == "0.10" and
            .coverage == {"required": 24, "observed": 24} and
            .mutants.required == 10 and
            .mutants.killed == 10 and
            .mutants.systemErrorCountedAsKill == false and
            .releaseTarget.productRelease == null
          ' build/reports/m08/check.json

          m09_log="${RUNNER_TEMP:-/tmp}/m09-gradle-output.log"
          set +e
          set -o pipefail
          ./gradlew m09Check --no-daemon --max-workers=1 2>&1 | tee "$m09_log"
          exit_code="${PIPESTATUS[0]}"
          set +o pipefail
          set -e
          test "$exit_code" -ne 0
          grep -Fq "M09 check status: GOAL_NOT_IMPLEMENTED" "$m09_log"
          jq -e '
            .schemaVersion == "matching.m09.check.v1" and
            .unit == "M09" and
            .status == "GOAL_NOT_IMPLEMENTED" and
            .contractPlanVersion == "0.11" and
            .inheritedBaseline == {
              "unit": "M08",
              "completeRef": "course/m08-complete",
              "expectedStatus": "PASS"
            } and
            .fixedCorpus.sha256 == "b9fd2679d3c82c52875e2a756a26f9c17c19072534477139331426d38f5393cd" and
            .fixedCorpus.primaryCount == 22 and
            .fixedCorpus.operations == 88 and
            .fixedCorpus.schemaProbes == 5 and
            .generator.sha256 == "794621a446f7896cd43b741809393025e063b0ffb190570d9057b90ce1dabda8" and
            .generator.baseSeed == "5909" and
            .generator.primaryCount == 96 and
            .generator.operations == 3840 and
            .generator.generatedOperations == 3840 and
            .generator.lanes == 4 and
            .generator.historiesPerLane == 24 and
            .generator.coverageObligations == 32 and
            .generator.crashWindows == 7 and
            .generator.failureSeams == 8 and
            .generator.recoveryBudget == {
              "maxSuffixRecords": 64,
              "maxSuffixBytes": 1048576,
              "exhaustionResult": "CHECKPOINT_REQUIRED_BEFORE_WAL"
            } and
            .snapshotContract.format == "M09S1" and
            .snapshotContract.state == "COMPLETE_CORE_IDENTITY_ORIGINAL_RESULTS_AND_TRANSCRIPT" and
            .snapshotContract.publication == "WRITE_TEMP_FORCE_ATOMIC_RENAME_DIRECTORY_FORCE" and
            .snapshotContract.recovery == "VALID_SNAPSHOT_THEN_CONTIGUOUS_M08W1_SUFFIX" and
            .snapshotContract.formatEvolution == false and
            .snapshotContract.unknownVersion == "FAIL_CLOSED" and
            .snapshotContract.realPowerLossClaim == false and
            (.requiredMutants | length) == 12 and
            (.tutorialPermalinks | length) == 5 and
            (.fixedCorpus | has("resultDigest") | not) and
            (.generator | has("resultDigest") | not) and
            (has("mutants") | not) and
            .releaseTarget.productRelease == null
          ' build/reports/m09/check.json
          test ! -e build/lab-evidence/M09

      - name: Upload M08 inherited reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m08-inherited-reports
          path: build/reports/m08/
          if-no-files-found: error

      - name: Upload M09 RED report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m09-reports
          path: build/reports/m09/
          if-no-files-found: error
