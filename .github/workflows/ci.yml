name: M00 baseline

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the green baseline
        run: ./gradlew clean build --no-daemon

      - name: Parse frozen JSON resources
        run: >-
          jq empty
          schemas/cex.lab-evidence.v1.schema.json
          schemas/matching.m00.fixture.v1.schema.json
          matching-testkit/src/test/resources/m00/fixtures/history-v1.json

      - name: Confirm the intentional M00 gap
        shell: bash
        run: |
          mkdir -p build/reports/m00
          m00_log=build/reports/m00/gradle-output.log
          set +e
          set -o pipefail
          ./gradlew m00Check --no-daemon 2>&1 | tee "$m00_log"
          exit_code="${PIPESTATUS[0]}"
          set +o pipefail
          set -e

          if [ "$exit_code" -eq 0 ]; then
            echo "m00Check unexpectedly passed at the start boundary"
            exit 1
          fi

          test -f build/reports/m00/check.json
          grep -Fq '> M00 goal is not implemented; see build/reports/m00/check.json' "$m00_log"
          if grep -Fq 'Build completed with 2 failures' "$m00_log"; then
            echo "m00Check mixed the educational gap with an infrastructure failure"
            exit 1
          fi
          jq -e '
            .schemaVersion == "matching.m00.check.v1" and
            .unit == "M00" and
            .status == "GOAL_NOT_IMPLEMENTED"
          ' build/reports/m00/check.json
