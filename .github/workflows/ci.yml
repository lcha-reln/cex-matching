name: Matching M09 completion

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
      - "matching-*"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Parse every frozen JSON resource
        shell: bash
        run: |
          mapfile -t resources < <(find schemas matching-testkit/src/test/resources -type f -name '*.json' -print | sort)
          test "${#resources[@]}" -gt 0
          jq empty "${resources[@]}"

      - name: Execute declared M09 boundary
        id: boundary
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M09
          test "$(sed -n 's/^planVersion=//p' course.properties)" = 0.11
          test "$(sed -n 's/^lifecycle=//p' course.properties)" = COMPLETE
          test "$(sed -n 's/^designDepth=//p' course.properties)" = IMPLEMENTED
          test "$(sed -n 's/^m09Check.expectedStatus=//p' course.properties)" = PASS
          test "$(sed -n 's/^startRef=//p' course.properties)" = course/m09-start
          test "$(sed -n 's/^completeRef=//p' course.properties)" = course/m09-complete
          test "$(git cat-file -t course/m08-complete)" = tag
          git merge-base --is-ancestor "$(git rev-parse 'course/m08-complete^{}')" HEAD
          test "$(git cat-file -t course/m09-start)" = tag
          git merge-base --is-ancestor "$(git rev-parse 'course/m09-start^{}')" HEAD
          test "$(git cat-file -t course/m09-complete)" = tag
          complete_commit="$(git rev-parse 'course/m09-complete^{}')"
          git merge-base --is-ancestor "$complete_commit" HEAD
          test -z "$(git tag --points-at HEAD --list 'matching-*')"

          ./gradlew clean build --no-daemon --max-workers=1
          ./gradlew m09Check --no-daemon --max-workers=1
          jq -e '
            .schemaVersion == "matching.m09.check.v2" and
            .unit == "M09" and
            .status == "PASS" and
            .contractPlanVersion == "0.11" and
            .inheritedM08 == {
              "unit": "M08",
              "completeRef": "course/m08-complete",
              "status": "PASS"
            } and
            .inputs == {
              "fixedSha256": "b9fd2679d3c82c52875e2a756a26f9c17c19072534477139331426d38f5393cd",
              "generatorSha256": "794621a446f7896cd43b741809393025e063b0ffb190570d9057b90ce1dabda8"
            } and
            .fixed.scenarios == 22 and
            .fixed.declaredOperations == 88 and
            .fixed.digest == "8d7e20c4b19dd51b8ca8b20d7d511b32c64c73dc1763434b62865303a00b76d5" and
            .generator.baseSeed == "5909" and
            .generator.histories == 96 and
            .generator.operationsPerHistory == 40 and
            .generator.operations == 3840 and
            .generator.declaredGeneratedOperations == 3840 and
            .generator.setupBudgetOperations == 65 and
            .generator.lanes == 4 and
            .generator.historiesPerLane == 24 and
            .generator.comparisons == 3840 and
            .generator.ledgerChecks == 4225 and
            .generator.budgetPredictionScope == "FRESH_APPEND_CANDIDATES_PLUS_CHECKPOINT_RETRIES_AND_65_SETUP_OPERATIONS" and
            .generator.budgetPredictionChecks == 2703 and
            .generator.budgetPredictedAccepts == 2702 and
            .generator.budgetPredictedRejects == 1 and
            .generator.checkpointRequiredWitnesses == 1 and
            .generator.digest == "9551ad7a3026964b57b366e39d6307510789cd83c750bf239098f9ba299354e5" and
            .generator.byteExactRegeneration == true and
            .snapshotRecovery == {
              "format": "M09S1",
              "genesisWalOracle": true,
              "independentStorageLedger": true,
              "independentLedgerUsesProductionWalParser": false,
              "wholeSegmentExactInventory": true,
              "maxSuffixRecords": 64,
              "maxSuffixBytes": 1048576,
              "realPowerLossClaim": false,
              "replication": false,
              "aeron": false,
              "externalTerminalSegmentDeletionDetection": false,
              "retirementEvidenceScope": "RUNTIME_RETIREMENT_NON_TERMINAL_GAP_AND_ACTIVE_OR_CROSSING_RETENTION"
            } and
            .coverage == {"required": 32, "observed": 32} and
            .faultEvidence == {
              "childRuntimeHalts": 7,
              "operationFailureSeams": 8,
              "systemHarnessFailuresAreSystemError": true,
              "fixedStorageOperationProgramOrderObserved": true,
              "childHaltAtDeclaredHookAndNamespaceObserved": true,
              "childUnderlyingOperationOrderClaim": false,
              "operationFailureAtDeclaredPreOperationHook": true,
              "operationFailureUnderlyingOperationExecutionClaim": false,
              "physicalDurabilityClaim": false,
              "realPowerLossClaim": false
            } and
            .mutants.required == 12 and
            .mutants.storageAndStateMutants == 9 and
            .mutants.invalidLatestAcceptanceCandidates == 3 and
            .mutants.executableCandidates == 12 and
            .mutants.killedAsStudentFailure == 12 and
            .mutants.throwingControl == "SYSTEM_ERROR" and
            .mutants.systemErrorCountedAsKill == false and
            .mutants.actualMutationActions >= 12 and
            .architecture.violations == 0 and
            .architecture.testkitProbeAbsentFromProduction == true and
            .architecture.storageOperationsProductionWiringVerified == true and
            .architecture.independentLedgerProductionParserFree == true and
            .releaseTarget.productRelease == null
          ' build/reports/m09/check.json
          jq -e '
            .results[] |
            select(.scenarioId == "RECOVERY_BUDGET_REJECTS_PRE_WAL") |
            .status == "PASS" and
            .assertion == "LIVE_RECORD_OVERRUN_REJECTED_PRE_WAL;LIVE_BYTE_OVERRUN_REJECTED_PRE_WAL;FRESH_RECOVERY_RECORD_OVERRUN_REJECTED_PRE_APPLY;FRESH_RECOVERY_BYTE_OVERRUN_REJECTED_PRE_APPLY" and
            .recoveryRecordFirstRejectedWalSequence == 65 and
            .recoveryByteFirstRejectedWalSequence == 29 and
            .recoveryRecordFailure == "M09 recovery suffix exceeds the configured records-and-bytes budget before WAL 65" and
            .recoveryByteFailure == "M09 recovery suffix exceeds the configured records-and-bytes budget before WAL 29" and
            .budgetWitnesses == [
              "LIVE_RECORD_OVERRUN_REJECTED_PRE_WAL",
              "LIVE_BYTE_OVERRUN_REJECTED_PRE_WAL",
              "FRESH_RECOVERY_RECORD_OVERRUN_REJECTED_PRE_APPLY",
              "FRESH_RECOVERY_BYTE_OVERRUN_REJECTED_PRE_APPLY"
            ]
          ' build/reports/m09/fixed-scenarios.json
          jq -e '
            .histories == 96 and
            .operations == 3840 and
            .declaredGeneratedOperations == 3840 and
            .setupBudgetOperations == 65 and
            .comparisons == 3840 and
            .ledgerChecks == 4225 and
            .inventoryChecks == 1366 and
            .restarts == 544 and
            .snapshots == 822 and
            .automaticCheckpoints == 1 and
            .businessRejections == 480 and
            .controlCommands == 480 and
            .budgetPredictionScope == "FRESH_APPEND_CANDIDATES_PLUS_CHECKPOINT_RETRIES_AND_65_SETUP_OPERATIONS" and
            .budgetPredictionChecks == 2703 and
            .budgetPredictedAccepts == 2702 and
            .budgetPredictedRejects == 1 and
            .checkpointRequiredWitnesses == 1 and
            .operationCounts == {
              "SUBMIT": 2133,
              "DUPLICATE": 166,
              "CONFLICT": 143,
              "SNAPSHOT": 413,
              "RESTART": 385,
              "ROLLOVER": 177,
              "RETIRE": 264,
              "CRASH": 159
            } and
            .forcedUnknownReopenOperations == 159 and
            .generatedCrashClaim == false and
            .digest == "9551ad7a3026964b57b366e39d6307510789cd83c750bf239098f9ba299354e5" and
            .freshRegenerationDigest == .digest and
            .byteExactRegeneration == true
          ' build/reports/m09/generated-properties.json
          jq -e '
            .required == 12 and
            .persisted == 12 and
            .rawOperations == 88 and
            .minimalOperations == 64 and
            .shrinkTrials == 152 and
            .actualMutationActions == 13 and
            .candidateDriver == "NINE_STORAGE_STATE_MUTANTS_PLUS_THREE_INVALID_LATEST_CANDIDATES" and
            .operationInterpreter == "SEQUENTIAL_TOKEN_INTERPRETER" and
            .oneMinimalGlobalMinimumClaim == false and
            .invalidHistoryCountedAsKill == false and
            .singleDeletePasses == 0 and
            .singleDeleteInvalidHistories == 64 and
            .singleDeleteDifferentStudentFailures == 0 and
            .singleDeleteSameFingerprintStudentFailures == 0 and
            .digest == "0dd88e0ced4a35dab53f357a657c299484eabeeb6111cd70221603a971f0a3eb"
          ' build/reports/m09/counterexamples.json
          for artifact in \
            inherited-m08.json fixed-scenarios.json fixed-history.canonical.utf8 \
            generated-properties.json generated-history.canonical.utf8 recovery-ledger.json \
            storage-inventory.json coverage.json crash-windows.json operation-failures.json \
            counterexamples-v1.json counterexamples.json counterexamples.canonical.utf8 \
            replay.json mutants.json architecture.json check.json; do
            test -s "build/reports/m09/$artifact"
          done

          evidence_generated=false
          if test "$complete_commit" = "$(git rev-parse HEAD)"; then
            ./gradlew m09Evidence -Pm09.unitTag=course/m09-complete --no-daemon --max-workers=1
            jq -e '
              .schemaVersion == "cex.lab-evidence.v1" and
              .case == "high-availability-cex" and
              .project == "matching" and
              .unit == "M09" and
              .unitTag == "course/m09-complete" and
              .productRelease == null and
              .planVersion == "0.11" and
              .source.commit == env.GITHUB_SHA and
              .source.dirty == false and
              (.claims | length) == 6 and
              (.limitations | length) == 13 and
              ([.claims[].artifacts[].path] | length) == 19 and
              ([.claims[].artifacts[].path] | unique | length) == 19
            ' build/lab-evidence/M09/manifest.json
            evidence_generated=true
          else
            echo "M09 evidence remains frozen at $complete_commit; validating descendant maintenance commit only."
          fi
          echo "evidence_generated=$evidence_generated" >> "$GITHUB_OUTPUT"

      - name: Upload M09 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-m09-reports
          path: build/reports/m09/
          if-no-files-found: error

      - name: Upload M09 clean-tree evidence
        if: steps.boundary.outputs.evidence_generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: matching-m09-evidence
          path: build/lab-evidence/M09/
          if-no-files-found: error
