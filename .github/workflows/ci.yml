name: Matching M01 contract

on:
  push:
    branches:
      - main
      - "unit/**"
    tags:
      - "course/**"
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Parse frozen JSON resources
        shell: bash
        run: |
          resources=(
            schemas/cex.lab-evidence.v1.schema.json
            schemas/matching.m00.fixture.v1.schema.json
            schemas/matching.m00.check.v2.schema.json
            matching-testkit/src/test/resources/m00/fixtures/history-v1.json
            schemas/matching.m01.scenario.v1.schema.json
            schemas/matching.m01.check.v1.schema.json
            matching-testkit/src/test/resources/m01/fixtures/price-time-v1.json
          )
          if [[ -f schemas/matching.m01.check.v2.schema.json ]]; then
            resources+=(schemas/matching.m01.check.v2.schema.json)
          fi
          jq empty "${resources[@]}"

      - name: Execute the declared M01 boundary
        id: boundary
        shell: bash
        run: |
          test "$(sed -n 's/^unit=//p' course.properties)" = M01
          expected_status="$(sed -n 's/^m01Check.expectedStatus=//p' course.properties)"
          case "$expected_status" in
            PASS)
              ./gradlew clean build m01Evidence \
                -Pm01.unitTag=course/m01-complete \
                --no-daemon
              test -f build/lab-evidence/M01/manifest.json
              jq -e '
                .schemaVersion == "matching.m01.check.v2" and
                .unit == "M01" and
                .status == "PASS" and
                .replays.completed == 100 and
                .replays.distinctDigests == 1 and
                ([.requiredMutants[].id] == [
                  "M01-SAME-PRICE-LIFO",
                  "M01-TAKER-PRICE",
                  "M01-SKIP-FIRST-MAKER"
                ]) and
                all(.requiredMutants[];
                  .classification == "STUDENT_FAILURE" and .killed == true) and
                .architecture.status == "PASS"
              ' build/reports/m01/check.json
              ;;
            GOAL_NOT_IMPLEMENTED)
              ./gradlew clean build --no-daemon
              mkdir -p build/reports/m01
              m01_log=build/reports/m01/gradle-output.log
              set +e
              set -o pipefail
              ./gradlew m01Check --no-daemon 2>&1 | tee "$m01_log"
              exit_code="${PIPESTATUS[0]}"
              set +o pipefail
              set -e
              test "$exit_code" -ne 0
              jq -e '
                .schemaVersion == "matching.m01.check.v1" and
                .unit == "M01" and
                .status == "GOAL_NOT_IMPLEMENTED" and
                .contractPlanVersion == "0.3" and
                .scenarioCorpus.scenarios == 8 and
                .scenarioCorpus.sha256 == "d050bc2fc029e3ac0afb5047e3030412412f3a7aecf0938a19a5953618ff9ed7" and
                .missingCapabilities == [
                  "ORDER_BOOK_STATE",
                  "PRICE_TIME_MATCHING",
                  "ORDERED_EVENT_BATCH"
                ]
              ' build/reports/m01/check.json
              ;;
            *)
              echo "Unknown m01Check.expectedStatus: $expected_status"
              exit 1
              ;;
          esac
          echo "expected_status=$expected_status" >> "$GITHUB_OUTPUT"

      - name: Verify M01 completion evidence semantics and hashes
        if: ${{ steps.boundary.outputs.expected_status == 'PASS' }}
        shell: bash
        run: |
          manifest=build/lab-evidence/M01/manifest.json
          jq -e '
            .schemaVersion == "cex.lab-evidence.v1" and
            .case == "high-availability-cex" and
            .project == "matching" and
            .unit == "M01" and
            .unitTag == "course/m01-complete" and
            .productRelease == null and
            .planVersion == "0.3" and
            .source.dirty == false and
            ([.claims[].id] == [
              "m00-input-regression",
              "price-time-priority",
              "matching-event-batches",
              "quantity-and-book-invariants",
              "deterministic-event-history",
              "semantic-mutants",
              "architecture-boundary"
            ]) and
            all(.claims[]; .status == "pass") and
            (.limitations | length) == 7
          ' "$manifest"

          while IFS=$'\t' read -r path expected; do
            actual="$(sha256sum "build/lab-evidence/M01/$path" | cut -d ' ' -f 1)"
            test "$actual" = "$expected"
          done < <(jq -r '.claims[].artifacts[] | [.path, .sha256] | @tsv' "$manifest")

          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Verify annotated M01 start tag identity
        if: ${{ startsWith(github.ref, 'refs/tags/course/m01') && endsWith(github.ref, '-start') }}
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$GITHUB_REF_NAME" = "$(sed -n 's/^startRef=//p' course.properties)"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"

      - name: Verify annotated M01 complete tag identity
        if: ${{ startsWith(github.ref, 'refs/tags/course/m01') && endsWith(github.ref, '-complete') }}
        shell: bash
        run: |
          test "${{ steps.boundary.outputs.expected_status }}" = PASS
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          peeled="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$peeled" = "$(jq -r '.source.commit' build/lab-evidence/M01/manifest.json)"
          test "$GITHUB_REF_NAME" = "$(jq -r '.unitTag' build/lab-evidence/M01/manifest.json)"

      - name: Upload M01 evidence
        if: ${{ steps.boundary.outputs.expected_status == 'PASS' }}
        uses: actions/upload-artifact@v6
        with:
          name: m01-evidence-${{ github.sha }}
          path: build/lab-evidence/M01
          if-no-files-found: error
